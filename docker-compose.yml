services:
  ghost:
    image: ghost:alpine
    container_name: the-dispatch-ghost
    restart: unless-stopped
    environment:
      NODE_ENV: production
      url: https://blog.dvaughnhouse.com
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
      database__client: better-sqlite3
      mail__transport: SMTP
      mail__options__host: relay
      mail__options__port: 25
      mail__from: noreply@blog.dvaughnhouse.com
      security__staffDeviceVerification: false
      tinybird__workspaceId: "55065f18-2817-4ee8-979e-3d14f0df44bd"
      tinybird__adminToken: ${TINYBIRD_ADMIN_TOKEN}
      tinybird__tracker__endpoint: "https://api.us-east.aws.tinybird.co"
      tinybird__tracker__token: ${TINYBIRD_TRACKER_TOKEN}
      tinybird__tracker__datasource: "analytics_events"
    ports:
      - "127.0.0.1:2368:2368"
    volumes:
      - the-dispatch-content:/var/lib/ghost/content
    depends_on:
      - relay
  relay:
    build: ./relay
    container_name: the-dispatch-relay
    restart: unless-stopped
    expose:
      - "25"
    volumes:
      - ./relay/keys:/etc/opendkim/keys:ro
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: the-dispatch-tunnel
    restart: unless-stopped
    command: tunnel --loglevel debug --config /etc/cloudflared/config.yml --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    network_mode: "host"
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - ghost
volumes:
  the-dispatch-content:
