# OpenDKIM: sign outgoing mail for blog.dvaughnhouse.com (selector dispatch).
# Signing-only relay; private key mounted read-only at /etc/opendkim/keys.
Domain                  blog.dvaughnhouse.com
Selector                dispatch
KeyFile                 /etc/opendkim/keys/dispatch.private
Socket                  inet:8891@localhost
Mode                    s
Canonicalization        relaxed/relaxed
UserID                  root
UMask                   002
Syslog                  no
RequireSafeKeys         no
